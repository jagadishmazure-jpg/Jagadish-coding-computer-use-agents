[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-computer-use-agents"
version = "0.1.0"
description = "Sandboxed coding agent scored on local bug-fix tasks, a guarded Playwright computer-use loop, and an invoice vision agent with confidence-based escalation"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["playwright==1.64.1", "pillow==13.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.3"]

[project.scripts]
cuagents = "cuagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]
"src/cuagents/coding/tasks.py" = ["E501"]
"src/cuagents/cli.py" = ["E501"]
"src/cuagents/computer/planner.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
